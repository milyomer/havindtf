<html lang="tr">
<head>

    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: Arial, Helvetica, sans-serif; }
        body { background-color: #f0f2f5; display: flex; justify-content: center; align-items: flex-start; min-height: 100vh; padding: 20px; }

        /* --- SOL PANEL --- */
        .sidebar { width: 260px; background-color: #1e293b; color: white; padding: 20px; border-radius: 12px; margin-right: 20px; position: sticky; top: 20px; box-shadow: 0 10px 15px -3px rgba(0,0,0,0.1); max-height: 95vh; overflow-y: auto; z-index: 1000; }
        .sidebar h2 { font-size: 16px; text-align: center; margin-bottom: 20px; padding-bottom: 15px; border-bottom: 1px solid #334155; text-transform: uppercase; }
        .btn { width: 100%; padding: 12px; margin-bottom: 10px; border: none; border-radius: 8px; font-weight: bold; cursor: pointer; font-size: 13px; transition: all 0.3s ease; display: flex; align-items: center; justify-content: center; gap: 6px; }
        
        .btn-add { background-color: #3b82f6; color: white; }
        .btn-add:hover { background-color: #2563eb; }
        
        .btn-cloud-save { background-color: #10b981; color: white; border: 2px solid #059669; }
        .btn-cloud-save:hover:not(:disabled) { background-color: #059669; }
        .btn-cloud-save:disabled { background-color: #475569; border-color: #334155; color: #cbd5e1; opacity: 0.8; cursor: not-allowed; }
        
        .btn-filter { background-color: #6366f1; color: white; margin-top: 15px; margin-bottom: 15px; }
        .btn-filter:hover { background-color: #4f46e5; }
        .btn-report { background-color: #0ea5e9; color: white; }
        .btn-report:hover { background-color: #0284c7; }
        .btn-print { background-color: #475569; color: white; }
        .btn-print:hover { background-color: #334155; }

        .report-section { padding-top: 20px; border-top: 1px solid #334155; }
        .report-section label { display: block; font-size: 12px; margin-bottom: 5px; color: #cbd5e1; }
        .report-section input[type="date"], .report-section select { width: 100%; padding: 8px; margin-bottom: 10px; border-radius: 6px; border: none; outline: none; font-size: 13px; }
        .manufacturer-filter-row { display: flex; align-items: flex-start; gap: 6px; }
        .manufacturer-filter-row select { flex: 1; min-width: 0; }
        .btn-delete-manufacturer { flex: 0 0 36px; width: 36px; height: 36px; margin: 0 0 10px; border: 1px solid #7f1d1d; border-radius: 6px; background: #991b1b; color: white; font-size: 20px; line-height: 1; cursor: pointer; }
        .btn-delete-manufacturer:hover:not(:disabled) { background: #b91c1c; }
        .btn-delete-manufacturer:disabled { opacity: 0.4; cursor: not-allowed; }

        /* --- A4 ALANI --- */
        .page-scroll-wrapper { flex: 1; overflow-x: auto; padding-bottom: 20px; }
        .a4-page { width: 210mm; min-height: 297mm; background: white; padding: 10mm; box-shadow: 0 0 20px rgba(0,0,0,0.1); border-radius: 8px; display: flex; flex-direction: column; gap: 10mm; margin: 0 auto; }

        /* --- BLOK YAPISI --- */
        .model-block { height: 53mm; border: 1px solid #cbd5e1; border-radius: 8px; display: flex; flex-direction: column; overflow: hidden; background-color: #fff; position: relative; }
        .model-meta { flex: 0 0 8mm; display: flex; align-items: center; gap: 4px; padding: 2px 6px; border-bottom: 1px solid #e2e8f0; min-width: 0; }
        .model-meta .labeled-input:first-child { flex: 3.2; }
        .model-meta .red-box { flex: 1.8; }
        .model-meta .info-note-input { flex: 1.5; margin-top: 0; }
        .model-meta .date-row { flex: 1.25; min-width: 0; }
        .model-content { flex: 1; min-height: 0; display: flex; }
        .model-panel { flex: 4.3; min-width: 0; display: flex; }
        .hidden-block { display: none !important; }
        .cloud-synced::after { content: '☁️ Kayıtlı'; position: absolute; top: 2px; left: 4px; font-size: 9px; color: #10b981; font-weight: bold; pointer-events: none; }

        /* Blok Komple Silme Butonu (Sağ Alt Köşe) */
        .delete-block-btn {
            position: absolute;
            bottom: 4px;
            right: 4px;
            background: #ef4444;
            color: white;
            border: none;
            border-radius: 50%;
            width: 20px;
            height: 20px;
            font-size: 10px;
            cursor: pointer;
            z-index: 20;
            display: none;
            align-items: center;
            justify-content: center;
            box-shadow: 0 2px 5px rgba(0,0,0,0.2);
        }
        .delete-block-btn:hover { background: #dc2626; }
        .model-block:hover .delete-block-btn { display: flex; }

        /* Resim Alanı */
        .image-col { flex: 1.6; padding: 8px; display: flex; align-items: center; justify-content: center; min-width: 0; min-height: 0; }
        .image-box { width: 100%; height: 100%; min-height: 0; padding: 4px; border: 2px dashed #94a3b8; border-radius: 6px; display: flex; align-items: center; justify-content: center; cursor: pointer; position: relative; text-align: center; }
        .image-preview { display: none; width: 100%; height: 100%; object-fit: contain; pointer-events: none; }
        .image-box.has-image .image-preview { display: block; }
        .image-box.has-image span { display: none; }
        .image-box span { color: #64748b; font-size: 12px; font-weight: bold; pointer-events: none; }
        .image-input-file { position: absolute; width: 100%; height: 100%; opacity: 0; cursor: pointer; left: 0; top: 0; }
        .gallery-open-btn { position: absolute; z-index: 2; bottom: 5px; left: 50%; transform: translateX(-50%); width: max-content; max-width: calc(100% - 10px); padding: 5px 8px; border: 1px solid #cbd5e1; border-radius: 4px; background: rgba(255,255,255,0.94); color: #1e293b; font-size: 10px; font-weight: bold; cursor: pointer; }
        .gallery-modal { position: fixed; inset: 0; z-index: 4000; display: flex; align-items: center; justify-content: center; padding: 18px; background: rgba(15,23,42,0.68); }
        .gallery-modal[hidden] { display: none; }
        .gallery-dialog { width: min(100%, 900px); height: min(85vh, 760px); max-height: min(85vh, 760px); display: flex; flex-direction: column; background: white; border-radius: 8px; box-shadow: 0 20px 50px rgba(0,0,0,0.3); overflow: hidden; }
        .gallery-header { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 14px 18px; border-bottom: 1px solid #e2e8f0; }
        .gallery-header h2 { color: #1e293b; font-size: 18px; }
        .gallery-close { width: 34px; height: 34px; border: 0; border-radius: 4px; background: #f1f5f9; color: #334155; font-size: 22px; cursor: pointer; }
        .gallery-status { padding: 10px 18px 0; color: #64748b; font-size: 13px; }
        .gallery-grid { flex: 1 1 auto; min-height: 0; display: grid; grid-template-columns: repeat(auto-fill, minmax(180px, 1fr)); grid-auto-rows: max-content; align-content: start; align-items: start; gap: 12px; padding: 16px 18px; overflow-y: auto; }
        .gallery-load-more { align-self: center; margin: 0 18px 16px; padding: 8px 14px; border: 1px solid #cbd5e1; border-radius: 4px; background: #f8fafc; color: #334155; font-weight: bold; cursor: pointer; }
        .gallery-load-more[hidden] { display: none; }
        .gallery-item { min-width: 0; position: relative; border: 1px solid #e2e8f0; border-radius: 5px; overflow: hidden; }
        .gallery-preview-btn { display: block; width: 100%; padding: 0; border: 0; background: #f8fafc; cursor: pointer; }
        .gallery-item img { display: block; width: 100%; aspect-ratio: 1; object-fit: contain; background: #f8fafc; }
        .gallery-item-name { padding: 7px 8px 0; color: #334155; font-size: 11px; overflow-wrap: anywhere; }
        .gallery-item-actions { display: flex; gap: 6px; padding: 7px; }
        .gallery-item-actions button { flex: 1; min-height: 30px; border: 0; border-radius: 4px; font-size: 12px; font-weight: bold; cursor: pointer; }
        .gallery-use-btn { background: #dbeafe; color: #1d4ed8; }
        .gallery-delete-btn { position: absolute; top: 4px; right: 4px; z-index: 2; width: 17px; height: 17px; min-height: 17px !important; padding: 0; background: #b91c1c; color: white; font-size: 10px !important; line-height: 17px; opacity: 0; pointer-events: none; box-shadow: 0 1px 4px rgba(0,0,0,0.25); transition: opacity 120ms ease; }
        .gallery-item:hover .gallery-delete-btn, .gallery-item:focus-within .gallery-delete-btn { opacity: 1; pointer-events: auto; }
        @media (hover: none) { .gallery-delete-btn { opacity: 1; pointer-events: auto; } }
        @media screen and (max-width: 600px) {
            .gallery-modal { padding: 8px; }
            .gallery-dialog { width: 100%; height: min(92vh, 900px); max-height: min(92vh, 900px); }
            .gallery-grid { grid-template-columns: minmax(0, 1fr); gap: 14px; padding: 12px; }
            .gallery-item img { width: min(100%, 320px); height: auto; margin: 0 auto; }
        }
        .delete-img-btn { position: absolute; top: 4px; right: 4px; background: #ef4444; color: white; border: none; border-radius: 50%; width: 20px; height: 20px; font-size: 10px; cursor: pointer; z-index: 10; display: none; align-items: center; justify-content: center; }
        .delete-img-btn:hover { background: #dc2626; }
        .image-box.has-image:hover .delete-img-btn { display: flex; }

        /* Ölçü & Metin Alanı */
        .measure-col { flex: 1.3; padding: 8px; display: flex; flex-direction: column; gap: 4px; border-left: 1px solid #e2e8f0; min-width: 0; }
        .mt-auto { margin-top: auto; }
        .measure-row { display: flex; align-items: center; justify-content: space-between; font-size: 11px; font-weight: bold; color: #334155; }
        .measure-row label { width: 40px; margin-right: auto; }
        .measure-row input { width: 33.33%; text-align: center; padding: 4px; border: 1px solid #cbd5e1; border-radius: 4px; font-size: 14px; font-weight: bold; outline: none; margin: 0 4px; min-width: 0; }
        .measure-row input:focus { border-color: #3b82f6; }
        .measure-row span.unit { width: 20px; text-align: right; }
        .column-heading { min-height: 22px; display: flex; align-items: flex-end; justify-content: center; padding: 0 2px; color: #0f172a; font-size: 11px; font-weight: bold; text-align: center; line-height: 1.1; }
        .measure-col .column-heading, .qty-col .column-heading { margin-top: auto; }

        .labeled-input { display: flex; align-items: center; border: 1px solid #cbd5e1; border-radius: 4px; background-color: #f1f5f9; overflow: hidden; height: 24px; min-width: 0; }
        .labeled-input span { font-size: 10px; font-weight: bold; padding: 0 4px; color: #475569; white-space: nowrap; border-right: 1px solid #cbd5e1; display: flex; align-items: center; height: 100%; background-color: #e2e8f0; }
        .labeled-input input, .labeled-input select { flex: 1; border: none; background: transparent; padding: 0 4px; font-size: 12px; font-weight: bold; text-align: center; outline: none; min-width: 0; width: 100%; text-transform: uppercase; color: #334155; }
        .labeled-input.red-box { background-color: #fef2f2; border-color: #fecaca; }
        .labeled-input.red-box span { background-color: #fee2e2; color: #ef4444; border-right-color: #fecaca; }
        .labeled-input.red-box select { color: #ef4444; cursor: pointer; }

        /* Adet Alanı */
        .qty-col { flex: 1.2; padding: 8px; display: flex; flex-direction: column; gap: 4px; border-left: 1px solid #e2e8f0; min-width: 0; }
        .qty-row { display: flex; align-items: center; justify-content: flex-end; gap: 4px; font-size: 12px; font-weight: bold; color: #334155; }
        .qty-row input { text-align: center; padding: 4px; border: 1px solid #cbd5e1; border-radius: 4px; font-size: 14px; font-weight: bold; outline: none; min-width: 0; }
        .qty-input { width: 45px; }
        .div-input { width: 30px; background-color: #eff6ff; border-color: #bfdbfe; color: #1d4ed8; }
        .progress-col { flex: 0.7; padding: 8px 4px; display: flex; flex-direction: column; gap: 4px; border-left: 1px solid #e2e8f0; min-width: 0; }
        .progress-row { justify-content: center; }
        .progress-input { width: 46px; }
        .progress-total { margin-top: auto; color: #0f172a; font-size: 12px; font-weight: bold; text-align: center; white-space: nowrap; }
        .info-note-input { width: 100%; text-align: center; padding: 4px; border: 1px solid #cbd5e1; border-radius: 4px; font-size: 12px; font-weight: bold; outline: none; color: #94a3b8; margin-top: auto; height: 24px; min-width: 0; }

        /* Sonuç ve Tarih */
        .result-col { flex: 0.4; padding: 4px; display: flex; flex-direction: column; align-items: center; background-color: #f8fafc; border-left: 1px solid #e2e8f0; min-width: 0; position: relative; }
        .date-row { display: flex; align-items: center; justify-content: center; width: 100%; }
        .date-row input[type="date"] { width: 100%; border: 1px solid #cbd5e1; background: white; text-align: center; font-size: 13px; font-weight: bold; color: #334155; padding: 4px; border-radius: 4px; cursor: pointer; outline: none; }
        .date-row input[type="date"]:focus { border-color: #3b82f6; }
        .result-text { font-size: 16px; font-weight: bold; color: #0f172a; margin: auto 0; white-space: nowrap; transform: rotate(90deg); }

        .auth-overlay { position: fixed; inset: 0; z-index: 3000; display: flex; align-items: center; justify-content: center; padding: 20px; background: rgba(15, 23, 42, 0.62); backdrop-filter: blur(3px); }
        .auth-overlay[hidden] { display: none; }
        .auth-card { width: min(100%, 380px); padding: 28px; border-radius: 12px; background: white; box-shadow: 0 20px 50px rgba(0,0,0,0.25); }
        .auth-card h2 { margin-bottom: 8px; color: #1e293b; font-size: 22px; }
        .auth-card p { margin-bottom: 20px; color: #64748b; font-size: 14px; }
        .auth-card label { display: block; margin: 12px 0 6px; color: #334155; font-size: 13px; font-weight: bold; }
        .auth-card input { width: 100%; padding: 11px; border: 1px solid #cbd5e1; border-radius: 6px; font-size: 15px; }
        .auth-card input:focus { border-color: #3b82f6; outline: 2px solid rgba(59,130,246,0.16); }
        .auth-submit { width: 100%; margin-top: 18px; padding: 12px; border: 0; border-radius: 6px; background: #2563eb; color: white; font-size: 14px; font-weight: bold; cursor: pointer; }
        .auth-submit:disabled { opacity: 0.65; cursor: wait; }
        .auth-error { margin: 14px 0 0 !important; color: #b91c1c !important; font-size: 13px !important; }
        .session-panel { margin: 12px 0 0; padding: 12px 10px; border: 1px solid #334155; border-radius: 6px; background: #172033; text-align: center; color: #cbd5e1; font-size: 12px; overflow-wrap: anywhere; }
        .session-panel[hidden] { display: none; }
        .btn-signout { width: 100%; margin-top: 9px; padding: 8px 10px; border: 1px solid #64748b; border-radius: 5px; background: transparent; color: white; font-size: 12px; cursor: pointer; }
        .btn-signout:hover { background: #334155; }

        /* MOBİL UYUM */
        @media screen and (max-width: 900px) {
            body { width: 100%; flex-direction: column; padding: 10px; overflow-x: hidden; }
            .sidebar {
                width: 100%;
                max-width: 100%;
                position: sticky;
                top: 10px;
                max-height: 35vh;
                max-height: 35dvh;
                overflow-y: auto;
                margin-right: 0;
                margin-bottom: 15px;
            }
            .page-scroll-wrapper { width: 100%; min-width: 0; flex: 0 0 auto; }
            .a4-page { margin: 0; }
        }

        /* YAZDIRMA AYARLARI */
        @media print {
            @page { size: A4; margin: 3mm; }
            .auth-overlay { display: none !important; }
            body, html { background: none !important; padding: 0 !important; margin: 0 !important; display: block !important; height: auto !important; min-height: 0 !important; }
            .sidebar { display: none !important; }
            .page-scroll-wrapper { overflow: visible !important; width: auto !important; padding: 0 !important; }
            .a4-page { 
                box-shadow: none !important; 
                padding: 0 !important; 
                width: 100% !important; 
                height: auto !important; 
                min-height: auto !important; 
                display: flex !important; 
                flex-direction: column !important; 
                gap: 1mm !important; 
                background: transparent !important; 
                margin: 0 !important; 
            }
            .model-block { 
                height: 56mm !important; 
                margin-bottom: 0 !important; 
                page-break-inside: avoid !important; 
                break-inside: avoid !important; 
                border: 1px solid #000 !important; 
                display: flex !important; 
            }
            .model-block:not(.hidden-block) { display: flex !important; }
            .hidden-block, .delete-block-btn { display: none !important; }
            .print-hidden { display: none !important; }
            .model-meta { border-bottom-color: #000 !important; }
            input, select { border: none !important; background: transparent !important; }
            .date-row input[type="date"] { color: #000 !important; padding: 0 !important; font-size: 13px !important; }
            .date-row input[type="date"]::-webkit-calendar-picker-indicator { display: none !important; -webkit-appearance: none; }
            .image-box { border: 1px solid #000 !important; }
            .image-box .image-preview { display: block !important; }
            .image-box span { display: none !important; }
            .hide-on-print { display: none !important; }
            input::placeholder { color: transparent !important; }
            .labeled-input { border: 1px solid transparent !important; background: transparent !important; }
            .labeled-input span { border-right: none !important; background: transparent !important; color: #000; padding: 0;}
            .labeled-input input, .labeled-input select { color: #000 !important; appearance: none; -webkit-appearance: none; }
            .cloud-synced::after { display: none !important; }
            .gallery-modal, .gallery-open-btn { display: none !important; }
        }
    </style>
</head>
<body>

    <div class="auth-overlay" id="authOverlay" role="dialog" aria-modal="true" aria-labelledby="authTitle">
        <section class="auth-card">
            <h2 id="authTitle">Giriş Yap</h2>
            <p id="authLoading">Oturum kontrol ediliyor...</p>
            <form id="authForm" onsubmit="loginWithEmail(event)" hidden>
                <label for="authEmail">E-posta</label>
                <input id="authEmail" type="email" autocomplete="username" required>
                <label for="authPassword">Şifre</label>
                <input id="authPassword" type="password" autocomplete="current-password" required>
                <p class="auth-error" id="authError" role="alert" hidden></p>
                <button class="auth-submit" id="authSubmitBtn" type="submit">Giriş Yap</button>
            </form>
        </section>
    </div>

    <div class="sidebar">
        <h2>Kontrol Paneli</h2>
        <button class="btn btn-add" onclick="addModelBlock(false)">➕ Yeni Model Ekle</button>
        <button class="btn btn-cloud-save" onclick="saveToFirebase()" id="saveBtn" disabled>☁️ Değişiklikleri Buluta Kaydet</button>

        <div class="report-section">
            <h2>Filtre / Rapor / Çıktı</h2>
            <label>Başlangıç Tarihi</label>
            <input type="date" id="startDate">
            <label>Bitiş Tarihi</label>
            <input type="date" id="endDate">
            <label>İmalatçı Filtresi</label>
            <div class="manufacturer-filter-row">
                <select id="reportManufacturer" onchange="updateManufacturerDeleteButton()">
                    <option value="TÜMÜ">TÜMÜ</option>
                </select>
                <button class="btn-delete-manufacturer" id="deleteManufacturerBtn" type="button" onclick="deleteSelectedManufacturer()" aria-label="Seçili imalatçıyı sil" title="Silmek için imalatçı seçin" disabled>×</button>
            </div>

            <button class="btn btn-filter" id="filterBtn" onclick="toggleFilter()">👁️ Ekranda Filtrele</button>
            <button class="btn btn-print" onclick="printReport()">🖨️ PDF / Çıktı Al</button>
            <button class="btn btn-report" onclick="exportReport()">📊 Excel Dökümü Al</button>
            <div class="session-panel" id="sessionPanel" hidden>
                <div id="sessionEmail"></div>
                <button class="btn-signout" type="button" onclick="signOutUser()">Oturumu Kapat</button>
            </div>
        </div>
    </div>

    <div class="page-scroll-wrapper">
        <div class="a4-page" id="a4Page"></div>
    </div>

    <div class="gallery-modal print-hidden" id="galleryModal" role="dialog" aria-modal="true" aria-labelledby="galleryTitle" hidden>
        <section class="gallery-dialog">
            <header class="gallery-header">
                <h2 id="galleryTitle">Resim Galerisi</h2>
                <button class="gallery-close" type="button" onclick="closeImageGallery()" aria-label="Galeriyi kapat">×</button>
            </header>
            <p class="gallery-status" id="galleryStatus" role="status">Resimler yükleniyor...</p>
            <div class="gallery-grid" id="galleryGrid"></div>
            <button class="gallery-load-more" id="galleryLoadMore" type="button" onclick="loadMoreGalleryImages()" hidden>Daha Fazla Yükle</button>
        </section>
    </div>

    <script>
       const firebaseConfig = {
    apiKey: "AIzaSyA0w0QdxzxIOAAbmvatqJE1Ot1TQ-SCEiw",
    authDomain: "havin-dtf.firebaseapp.com",
    projectId: "havin-dtf",
    storageBucket: "havin-dtf.firebasestorage.app",
    messagingSenderId: "421739419490",
    appId: "1:421739419490:web:3e3c628005b681ebd2fe3b"
  };

        if (!firebase.apps.length) {
            firebase.initializeApp(firebaseConfig);
        }
        const db = firebase.firestore();
        const auth = firebase.auth();
        const COLLECTION_NAME = "havin_uretim";
        const IMAGE_LIBRARY_NAME = "havin_galeri";
        const MANUFACTURER_SETTINGS_ID = "_ayarlar_imalatcilar";
        const MAX_IMAGE_SIDE = 300;
        const JPEG_QUALITY = 0.7;
        let hasUnsavedChanges = false;
        let isSaving = false;
        let changeVersion = 0;
        let galleryTargetBlock = null;
        let galleryCursor = null;
        let legacyGalleryCursor = null;
        let galleryItems = new Map();
        let galleryHasMore = false;
        let galleryLoading = false;

        const a4Page = document.getElementById('a4Page');
        function getIstanbulDateString(date = new Date()) {
            const dateParts = {};
            new Intl.DateTimeFormat('en-CA', {
                timeZone: 'Europe/Istanbul',
                year: 'numeric',
                month: '2-digit',
                day: '2-digit'
            }).formatToParts(date).forEach(part => {
                if (part.type !== 'literal') dateParts[part.type] = part.value;
            });
            return `${dateParts.year}-${dateParts.month}-${dateParts.day}`;
        }

        let manufacturerList = JSON.parse(localStorage.getItem('havin_imalatcilar')) || ['HAVİN'];

        let authNotice = '';

        window.onload = async () => {
            const startDate = new Date(`${getIstanbulDateString()}T12:00:00Z`);
            startDate.setUTCDate(startDate.getUTCDate() - 3);
            document.getElementById('startDate').value = getIstanbulDateString(startDate);
            document.getElementById('endDate').value = getIstanbulDateString();
            showAuthLoading();

            try {
                await auth.setPersistence(firebase.auth.Auth.Persistence.SESSION);
                auth.onAuthStateChanged(async user => {
                    if (!user) {
                        a4Page.innerHTML = '';
                        document.getElementById('sessionPanel').hidden = true;
                        showLoginForm(authNotice);
                        authNotice = '';
                        return;
                    }

                    showAuthLoading('Veriler yükleniyor...');
                    try {
                        await loadFromFirebase();
                        if (isFilterActive) {
                            filterBlocks();
                        } else {
                            toggleFilter();
                        }
                        document.getElementById('sessionEmail').textContent = user.email || 'Oturum açık';
                        document.getElementById('sessionPanel').hidden = false;
                        document.getElementById('authOverlay').hidden = true;
                    } catch (error) {
                        console.error("Oturumla veri yüklenemedi:", error);
                        authNotice = error.code === 'permission-denied'
                            ? 'Bu hesabın veritabanına erişim izni yok. UID ve Firestore kurallarını kontrol edin.'
                            : 'Veriler yüklenemedi. İnternet bağlantınızı ve Firestore kurallarını kontrol edin.';
                        await auth.signOut();
                    }
                });
            } catch (error) {
                console.error("Firebase Auth başlatılamadı:", error);
                showLoginForm('Giriş sistemi başlatılamadı. Sayfayı yenileyip tekrar deneyin.');
            }
        };

        function showAuthLoading(message = 'Oturum kontrol ediliyor...') {
            const overlay = document.getElementById('authOverlay');
            overlay.hidden = false;
            document.getElementById('authLoading').textContent = message;
            document.getElementById('authLoading').hidden = false;
            document.getElementById('authForm').hidden = true;
        }

        function showLoginForm(message = '') {
            const overlay = document.getElementById('authOverlay');
            overlay.hidden = false;
            document.getElementById('authLoading').hidden = true;
            document.getElementById('authForm').hidden = false;
            const error = document.getElementById('authError');
            error.textContent = message;
            error.hidden = !message;
        }

        async function loginWithEmail(event) {

                    document.getElementById('authPassword').value

                console.error("Giriş başarısız:", error);
                const message = error.code === 'auth/too-many-requests'
                    ? 'Çok fazla başarısız deneme oldu. Bir süre sonra tekrar deneyin.'
                    : 'E-posta veya şifre hatalı.';
                showLoginForm(message);

        async function loadFromFirebase() {
            try {
                const snapshot = await db.collection(COLLECTION_NAME).orderBy("timestamp", "desc").limit(50).get();
                await syncManufacturerList(snapshot);
                const galleryImages = new Map();
                const galleryIds = [...new Set(snapshot.docs.map(doc => doc.data().imageGalleryId).filter(Boolean))];
                try {
                    for (let index = 0; index < galleryIds.length; index += 10) {
                        const idGroup = galleryIds.slice(index, index + 10);
                        const gallerySnapshot = await db.collection(IMAGE_LIBRARY_NAME)
                            .where(firebase.firestore.FieldPath.documentId(), 'in', idGroup).get();
                        gallerySnapshot.forEach(doc => galleryImages.set(doc.id, doc.data().image));
                    }
                } catch (galleryError) {
                    console.warn("Galeri görselleri yüklenemedi:", galleryError);
                }
                a4Page.innerHTML = '';
                if (snapshot.empty) {
                    addModelBlock(true);
                } else {
                    snapshot.forEach(doc => {
                        const data = doc.data();
                        if (data.imageGalleryId && galleryImages.has(data.imageGalleryId)) {
                            data.image = galleryImages.get(data.imageGalleryId);
                        }
                        addModelBlock(true, doc.id, data);
                    });
                }
                updateManufacturerDropdowns();
                sortModelBlocksByDate();
                hasUnsavedChanges = false;
                changeVersion++;
                updateSaveButton();
            } catch (error) {
                console.error("Buluttan yükleme hatası:", error);
                throw error;
            }
        }

        async function saveToFirebase() {
            if (!auth.currentUser || !hasUnsavedChanges || isSaving) return;
            const btn = document.getElementById('saveBtn');
            const saveVersion = changeVersion;
            isSaving = true;
            btn.innerText = "⏳ Kaydediliyor...";
            updateSaveButton();
            const blocks = document.querySelectorAll('.model-block');
            let successCount = 0;
            let failedCount = 0;

            for (let block of blocks) {
                const modelKodu = block.querySelector('.model-kodu-input').value.trim();
                const hasImage = block.querySelector('.image-box').classList.contains('has-image');
                if (!modelKodu && !hasImage) continue; 

                const mInputs = block.querySelectorAll('.m-input');
                const qtyInputs = block.querySelectorAll('.qty-input');
                const divInputs = block.querySelectorAll('.div-input');
                const doneInputs = block.querySelectorAll('.done-input');
                const remainingInputs = block.querySelectorAll('.remaining-input');
                const image = block.querySelector('.image-preview');
                let galleryImageId = block.dataset.galleryImageId || '';

                try {
                    if (hasImage && !galleryImageId) {
                        const galleryDoc = await db.collection(IMAGE_LIBRARY_NAME).add({
                            image: image.src,
                            name: modelKodu || 'Model görseli',
                            createdAt: firebase.firestore.FieldValue.serverTimestamp()
                        });
                        galleryImageId = galleryDoc.id;
                        block.dataset.galleryImageId = galleryImageId;
                    }

                    const dataObj = {
                        date: block.querySelector('.block-date').value,
                        modelKodu: modelKodu,
                        imalatci: block.querySelector('.red-text-select').value,
                        image: '',
                        imageGalleryId: hasImage ? galleryImageId : '',
                        on: { cm: mInputs[0].value, adet: qtyInputs[0].value, div: divInputs[0].value },
                        arka: { cm: mInputs[1].value, adet: qtyInputs[1].value, div: divInputs[1].value },
                        rapor: { cm: mInputs[2].value, adet: qtyInputs[2].value, div: divInputs[2].value },
                        yapilan: { on: doneInputs[0].value, arka: doneInputs[1].value, rapor: doneInputs[2].value },
                        kalan: { on: remainingInputs[0].value, arka: remainingInputs[1].value, rapor: remainingInputs[2].value },
                        not: block.querySelector('.info-note-input').value,
                        totalMt: block.querySelector('.result-text').innerText,
                        timestamp: firebase.firestore.FieldValue.serverTimestamp()
                    };

                    const docId = block.dataset.firebaseId;
                    if (docId) {
                        delete dataObj.timestamp; 
                        await db.collection(COLLECTION_NAME).doc(docId).update(dataObj);
                    } else {
                        const docRef = await db.collection(COLLECTION_NAME).add(dataObj);
                        block.dataset.firebaseId = docRef.id;
                    }
                    block.classList.add('cloud-synced');
                    successCount++;
                } catch (err) {
                    console.error("Kaydetme hatası:", err);
                    failedCount++;
                }
            }

            sortModelBlocksByDate();
            isSaving = false;
            if (failedCount === 0 && changeVersion === saveVersion) hasUnsavedChanges = false;
            updateSaveButton();
            if (successCount > 0 && failedCount === 0) {
                btn.style.backgroundColor = "#047857";
                setTimeout(() => {
                    btn.style.backgroundColor = "";
                    updateSaveButton();
                }, 1000);
            }
        }

        function updateSaveButton() {
            const button = document.getElementById('saveBtn');
            if (!button) return;
            button.disabled = isSaving || !hasUnsavedChanges;
            if (!isSaving) button.innerText = "☁️ Değişiklikleri Buluta Kaydet";
        }

        async function syncManufacturerList(snapshot) {
            const modelManufacturers = [];
            snapshot.forEach(doc => {
                const name = doc.data().imalatci;
                if (name && name.trim()) modelManufacturers.push(name);
            });

            const normalizeNames = names => [...new Set((Array.isArray(names) ? names : [])
                .filter(name => typeof name === 'string')
                .map(name => name.trim().toLocaleUpperCase('tr-TR'))
                .filter(Boolean))];
            const localNames = normalizeNames(manufacturerList);
            const settingsRef = db.collection(COLLECTION_NAME).doc(MANUFACTURER_SETTINGS_ID);

            try {
                manufacturerList = await db.runTransaction(async transaction => {
                    const settingsSnapshot = await transaction.get(settingsRef);
                    if (!settingsSnapshot.exists) {
                        const initialNames = normalizeNames([...localNames, ...modelManufacturers]);
                        transaction.set(settingsRef, { names: initialNames });
                        return initialNames;
                    }

                    const cloudNames = normalizeNames(settingsSnapshot.data().names);
                    const missingNames = normalizeNames(modelManufacturers).filter(name => !cloudNames.includes(name));
                    if (missingNames.length) {
                        transaction.update(settingsRef, {
                            names: firebase.firestore.FieldValue.arrayUnion(...missingNames)
                        });
                    }
                    return normalizeNames([...cloudNames, ...missingNames]);
                });
            } catch (error) {
                console.error('İmalatçı listesi buluttan eşitlenemedi:', error);
                manufacturerList = normalizeNames([...localNames, ...modelManufacturers]);
            }

            localStorage.setItem('havin_imalatcilar', JSON.stringify(manufacturerList));
        }

        async function deleteSelectedManufacturer() {
            const reportSelect = document.getElementById('reportManufacturer');
            const name = reportSelect.value;
            if (!name || name === 'TÜMÜ') return;

            if (Array.from(document.querySelectorAll('.red-text-select')).some(select => select.value === name)) {
                alert('Bu imalatçı açık model kartlarında seçili. Önce modelleri yeni imalatçıyla kaydedin.');
                return;
            }

            if (!confirm(`${name} imalatçısını bulut listesinden silmek istiyor musunuz?`)) return;

            const button = document.getElementById('deleteManufacturerBtn');
            button.disabled = true;
            try {
                const modelSnapshot = await db.collection(COLLECTION_NAME)
                    .where('imalatci', '==', name)
                    .limit(1)
                    .get();
                if (!modelSnapshot.empty) {
                    alert('Bu imalatçıya kayıtlı model bulunduğu için silinemez.');
                    return;
                }

                const settingsRef = db.collection(COLLECTION_NAME).doc(MANUFACTURER_SETTINGS_ID);
                await db.runTransaction(async transaction => {
                    const settingsSnapshot = await transaction.get(settingsRef);
                    const names = settingsSnapshot.exists ? settingsSnapshot.data().names : [];
                    if (!Array.isArray(names) || !names.includes(name)) {
                        throw new Error('İmalatçı bulut listesinde bulunamadı. Listeyi yenileyip tekrar deneyin.');
                    }
                    transaction.update(settingsRef, {
                        names: firebase.firestore.FieldValue.arrayRemove(name)
                    });
                });

                manufacturerList = manufacturerList.filter(manufacturer => manufacturer !== name);
                localStorage.setItem('havin_imalatcilar', JSON.stringify(manufacturerList));
                updateManufacturerDropdowns();
                if (isFilterActive) filterBlocks();
            } catch (error) {
                console.error('İmalatçı silinemedi:', error);
                alert(error.message || 'İmalatçı silinirken bulut bağlantısı hatası oluştu.');
            } finally {
                updateManufacturerDeleteButton();
            }
        }

        async function handleManufacturerChange(selectElement) {
            if (selectElement.value === 'YENI_EKLE') {
                let yeniIsim = prompt("Yeni İmalatçı Adını Giriniz:");
                if (yeniIsim && yeniIsim.trim() !== '') {
                    yeniIsim = yeniIsim.trim().toLocaleUpperCase('tr-TR');
                    try {
                        await db.collection(COLLECTION_NAME).doc(MANUFACTURER_SETTINGS_ID).set({
                            names: firebase.firestore.FieldValue.arrayUnion(yeniIsim)
                        }, { merge: true });
                    } catch (error) {
                        console.error('İmalatçı buluta eklenemedi:', error);
                        updateManufacturerDropdowns();
                        selectElement.value = '';
                        alert('İmalatçı buluta eklenemedi. Bağlantıyı kontrol edip tekrar deneyin.');
                        return;
                    }
                    if (!manufacturerList.includes(yeniIsim)) {
                        manufacturerList.push(yeniIsim);
                        localStorage.setItem('havin_imalatcilar', JSON.stringify(manufacturerList));
                    }
                    updateManufacturerDropdowns(); 
                    selectElement.value = yeniIsim;
                } else {
                    selectElement.value = ""; 
                }
            }
        }

            await loadMoreGalleryImages();
        }

        async function loadMoreGalleryImages() {
            if (galleryLoading) return;
            galleryLoading = true;
            const status = document.getElementById('galleryStatus');
            const loadMoreButton = document.getElementById('galleryLoadMore');
            loadMoreButton.disabled = true;
            status.textContent = 'Resimler yükleniyor...';

            try {
                const galleryQuery = db.collection(IMAGE_LIBRARY_NAME).orderBy('createdAt', 'desc').limit(24);
                const legacyQuery = db.collection(COLLECTION_NAME).orderBy('timestamp', 'desc').limit(24);
                const [gallerySnapshot, legacySnapshot] = await Promise.all([
                    galleryCursor ? galleryQuery.startAfter(galleryCursor).get() : galleryQuery.get(),
                    legacyGalleryCursor ? legacyQuery.startAfter(legacyGalleryCursor).get() : legacyQuery.get()
                ]);

                gallerySnapshot.forEach(doc => {
                    const data = doc.data();
                    if (data.image) galleryItems.set(doc.id, { id: doc.id, image: data.image, name: data.name || 'Model görseli' });
                });
                legacySnapshot.forEach(doc => {
                    const data = doc.data();
                    if (typeof data.image !== 'string' || !data.image.startsWith('data:image/')) return;
                    const existing = [...galleryItems.values()].find(item => item.image === data.image);
                    if (existing) {
                        existing.legacyImage = data.image;
                        existing.legacyCount = (existing.legacyCount || 0) + 1;
                        existing.name = `${existing.name.split(' · ')[0]} · ${existing.legacyCount} eski kayıt`;
                        return;
                    }
                    const legacyItem = [...galleryItems.values()].find(item => item.legacyImage === data.image);
                    if (legacyItem) {
                        legacyItem.legacyCount++;
                        legacyItem.name = `Eski kayıt · ${legacyItem.legacyCount} model`;
                        return;
                    }
                    const key = `legacy-${doc.id}`;
                    galleryItems.set(key, { id: '', image: data.image, legacyImage: data.image, legacyCount: 1, name: data.modelKodu || 'Eski kayıt' });
                });

                galleryCursor = gallerySnapshot.size === 24 ? gallerySnapshot.docs[gallerySnapshot.size - 1] : null;
                legacyGalleryCursor = legacySnapshot.size === 24 ? legacySnapshot.docs[legacySnapshot.size - 1] : null;
                galleryHasMore = Boolean(galleryCursor || legacyGalleryCursor);
                renderGalleryItems([...galleryItems.values()]);
                status.textContent = galleryItems.size
                    ? `${galleryItems.size} resim yüklendi · Silme işlemi bağlı model kartlarını da boşaltır.`
                    : galleryHasMore ? 'Eski kayıtlar aranıyor...' : 'Galeride henüz resim yok.';
                loadMoreButton.hidden = !galleryHasMore;
            } catch (error) {
                console.error('Galeri yüklenemedi:', error);
                if (error.code === 'permission-denied') {
                    status.textContent = 'Firestore kuralları havin_galeri koleksiyonunu okumaya izin vermiyor.';
                } else if (error.code === 'failed-precondition') {
                    status.textContent = 'Firestore sorgusu için gerekli indeks oluşturulmalı. Konsoldaki hata bağlantısını açın.';
                } else {
                    status.textContent = `Galeri yüklenemedi (${error.code || 'bilinmeyen hata'}). Ayrıntılar için tarayıcı konsolunu kontrol edin.`;
                }
            } finally {
                galleryLoading = false;
                loadMoreButton.disabled = false;
            }
        }

        function renderGalleryItems(items) {
            const grid = document.getElementById('galleryGrid');
            grid.innerHTML = '';
            items.forEach(item => {
                const tile = document.createElement('article');
                tile.className = 'gallery-item';
                const preview = document.createElement('img');
                preview.src = item.image;
                preview.alt = item.name;
                const previewButton = document.createElement('button');
                previewButton.type = 'button';
                previewButton.className = 'gallery-preview-btn';
                previewButton.title = 'Resmi kullan';
                previewButton.addEventListener('click', () => selectGalleryImage(item));
                previewButton.appendChild(preview);
                const name = document.createElement('div');
                name.className = 'gallery-item-name';
                name.textContent = item.name;
                const actions = document.createElement('div');
                actions.className = 'gallery-item-actions';
                const useButton = document.createElement('button');
                useButton.type = 'button';
                useButton.className = 'gallery-use-btn';
                useButton.textContent = 'Kullan';
                useButton.addEventListener('click', () => selectGalleryImage(item));
                const deleteButton = document.createElement('button');
                deleteButton.type = 'button';
                deleteButton.className = 'gallery-delete-btn';
                deleteButton.textContent = '×';
                deleteButton.title = 'Resmi ve kullanıldığı model kartlarını sil';
                deleteButton.setAttribute('aria-label', `${item.name} resmini sil`);
                deleteButton.addEventListener('click', () => deleteGalleryImage(item));
                actions.append(useButton, deleteButton);
                tile.append(previewButton, name, actions);
                grid.appendChild(tile);
            });
        }

        async function selectGalleryImage(item) {
            if (!galleryTargetBlock) return;
            try {
                let imageId = item.id;
                if (!imageId) {
                    const galleryDoc = await db.collection(IMAGE_LIBRARY_NAME).add({
                        image: item.image,
                        name: item.name,
                        createdAt: firebase.firestore.FieldValue.serverTimestamp()
                    });
                    imageId = galleryDoc.id;
                }
                const box = galleryTargetBlock.querySelector('.image-box');
                box.querySelector('.image-preview').src = item.image;
                box.classList.add('has-image');
                box.querySelector('.image-input-file').value = '';
                galleryTargetBlock.dataset.galleryImageId = imageId;
                galleryTargetBlock.classList.remove('cloud-synced');
                markUnsavedChanges();
                closeImageGallery();
            } catch (error) {
                console.error('Resim seçilemedi:', error);
                document.getElementById('galleryStatus').textContent = 'Resim seçilemedi. Firestore yazma izinlerini kontrol edin.';
            }
        }

        async function deleteGalleryImage(item) {
            if (!confirm('Bu resmi galeriden silmek istiyor musunuz? Kullanıldığı kayıtlı model kartları da boşaltılacak.')) return;
            const status = document.getElementById('galleryStatus');
            status.textContent = 'Resim ve bağlı kayıtlar siliniyor...';
            try {
                const affectedDocs = new Map();
                if (item.id) {
                    const references = await db.collection(COLLECTION_NAME).where('imageGalleryId', '==', item.id).get();
                    references.forEach(doc => affectedDocs.set(doc.id, doc.ref));
                }
                if (item.legacyImage) {
                    const allModels = await db.collection(COLLECTION_NAME).get();
                    allModels.forEach(doc => {
                        if (doc.data().image === item.legacyImage) affectedDocs.set(doc.id, doc.ref);
                    });
                }

                const referencesToClear = [...affectedDocs.values()];
                for (let index = 0; index < referencesToClear.length; index += 450) {
                    const batch = db.batch();
                    referencesToClear.slice(index, index + 450).forEach(ref => {
                        batch.update(ref, { image: '', imageGalleryId: '' });
                    });
                    await batch.commit();
                }
                if (item.id) await db.collection(IMAGE_LIBRARY_NAME).doc(item.id).delete();

                document.querySelectorAll('.model-block').forEach(block => {
                    const preview = block.querySelector('.image-preview');
                    if ((item.id && block.dataset.galleryImageId === item.id) || (item.legacyImage && preview.src === item.legacyImage)) {
                        preview.removeAttribute('src');
                        block.querySelector('.image-box').classList.remove('has-image');
                        block.querySelector('.image-input-file').value = '';
                        delete block.dataset.galleryImageId;
                        block.classList.remove('cloud-synced');
                    }
                });
                status.textContent = 'Resim ve bağlı model kartlarındaki görseller silindi.';
                const targetButton = galleryTargetBlock?.querySelector('.gallery-open-btn') || document.querySelector('.gallery-open-btn');
                await openImageGallery({ preventDefault() {}, stopPropagation() {} }, targetButton);
            } catch (error) {
                console.error('Galeri resmi silinemedi:', error);
                status.textContent = 'Silme başarısız. Firestore güvenlik kurallarını kontrol edin.';
            }
        }

        function closeImageGallery() {
            document.getElementById('galleryModal').hidden = true;
            galleryTargetBlock = null;
        }

        function readFileAsDataUrl(file) {
            return new Promise((resolve, reject) => {
                const reader = new FileReader();
                reader.onload = () => resolve(reader.result);
                reader.onerror = () => reject(reader.error || new Error('Resim dosyası okunamadı.'));
                reader.readAsDataURL(file);
            });
        }

        function resizeImageDataUrl(dataUrl) {
            return new Promise((resolve, reject) => {
                const img = new Image();
                img.onload = function() {
                    try {
                        const scale = Math.min(1, MAX_IMAGE_SIDE / Math.max(img.naturalWidth, img.naturalHeight));
                        const width = Math.max(1, Math.round(img.naturalWidth * scale));
                        const height = Math.max(1, Math.round(img.naturalHeight * scale));
                        const canvas = document.createElement('canvas');
                        canvas.width = width;
                        canvas.height = height;
                        const context = canvas.getContext('2d');
                        if (!context) throw new Error('Resim dönüştürme alanı oluşturulamadı.');
                        context.imageSmoothingQuality = 'high';
                        context.drawImage(img, 0, 0, width, height);
                        resolve(canvas.toDataURL('image/jpeg', JPEG_QUALITY));
                    } catch (error) {
                        reject(error);
                    }
                };
                img.onerror = () => reject(new Error('Resim çözümlenemedi.'));
                img.src = dataUrl;
            });
        }

        async function compressAndLoadImage(event, input) {
            const file = event.target.files[0];
            if (!file) return;
            try {
                const source = await readFileAsDataUrl(file);
                const optimizedImage = await resizeImageDataUrl(source);
                const box = input.closest('.image-box');
                box.querySelector('.image-preview').src = optimizedImage;
                box.querySelector('span').style.display = 'none';
                box.classList.add('has-image');
                delete input.closest('.model-block').dataset.galleryImageId;
                input.closest('.model-block').classList.remove('cloud-synced');
                markUnsavedChanges();
            } catch (error) {
                console.error('Resim işlenemedi:', error);
                alert('Resim işlenemedi. Farklı bir resim dosyası deneyin.');
            } finally {
                input.value = '';
            }
        }

        function removeImage(event, btn) {
            event.stopPropagation(); event.preventDefault();
            const box = btn.closest('.image-box');
            box.querySelector('.image-preview').removeAttribute('src');
            box.classList.remove('has-image');
            box.querySelector('span').style.display = 'block';
            box.querySelector('.image-input-file').value = ''; 
            delete btn.closest('.model-block').dataset.galleryImageId;
            btn.closest('.model-block').classList.remove('cloud-synced');
            markUnsavedChanges();
        }

        function parseLocalFloat(str) {
            if(!str) return 0;
            return parseFloat(str.replace(',', '.')) || 0;
        }

        function calculateTotal(block) {
            const mInputs = block.querySelectorAll('.m-input');
            const qtyInputs = block.querySelectorAll('.qty-input');
            const divInputs = block.querySelectorAll('.div-input');
            let totalMeters = 0;
            for(let i=0; i<3; i++) {
                let cm = parseLocalFloat(mInputs[i].value);
                let qty = parseLocalFloat(qtyInputs[i].value);
                let div = parseLocalFloat(divInputs[i].value);
                if(div === 0 || isNaN(div)) div = 1; 
                let actualQty = qty / div;
                let meters = (cm * actualQty) / 100;
                totalMeters += meters;
            }
            const resText = block.querySelector('.result-text');
            if (totalMeters > 0) {
                resText.innerText = formatMeterValue(totalMeters);
            } else {
                resText.innerText = '';
            }
            calculateProgressMeters(block);
            block.classList.remove('cloud-synced');
        }

        function formatMeterValue(totalMeters) {
            return parseFloat(totalMeters.toFixed(1)).toString().replace('.', ',') + ' MT';
        }

        function calculateProgressMeters(block) {
            const measurements = block.querySelectorAll('.m-input');
            const progressGroups = [
                { inputs: block.querySelectorAll('.done-input'), output: block.querySelector('.done-total') },
                { inputs: block.querySelectorAll('.remaining-input'), output: block.querySelector('.remaining-total') }
            ];

            progressGroups.forEach(group => {
                let totalMeters = 0;
                for (let i = 0; i < 3; i++) {
                    totalMeters += (parseLocalFloat(measurements[i].value) * parseLocalFloat(group.inputs[i].value)) / 100;
                }
                group.output.innerText = formatMeterValue(totalMeters);
            });
        }

        function preparePrintOutput() {
            document.querySelectorAll('.model-block').forEach(block => {
                const reportHasData = Boolean(
                    block.querySelectorAll('.m-input')[2].value.trim() ||
                    block.querySelectorAll('.qty-input')[2].value.trim()
                );
                block.querySelectorAll('.measure-row')[2].classList.toggle('print-hidden', !reportHasData);
                block.querySelectorAll('.qty-row')[2].classList.toggle('print-hidden', !reportHasData);

                const progressColumns = block.querySelectorAll('.progress-col');
                const progressInputs = [block.querySelectorAll('.done-input'), block.querySelectorAll('.remaining-input')];
                progressInputs.forEach((inputs, index) => {
                    const hasData = Array.from(inputs).some(input => input.value.trim());
                    progressColumns[index].classList.toggle('print-hidden', !hasData);
                });
            });
        }

        const defaultDocumentTitle = document.title;

        function printReport() {
            const startStr = document.getElementById('startDate').value;
            const endStr = document.getElementById('endDate').value;
            const formatDate = date => date ? date.split('-').reverse().join('.') : 'Tarih';
            document.title = `${formatDate(startStr)} ve ${formatDate(endStr)} arası DTF siparişi`;
            window.print();
        }

        function clearPrintOutput() {
            document.querySelectorAll('.print-hidden').forEach(element => element.classList.remove('print-hidden'));
            document.title = defaultDocumentTitle;
        }

        window.addEventListener('beforeprint', preparePrintOutput);
        window.addEventListener('afterprint', clearPrintOutput);

        let isFilterActive = false;

        function toggleFilter() {
            const btn = document.getElementById('filterBtn');
            if (!isFilterActive) {
                const startStr = document.getElementById('startDate').value;
                const endStr = document.getElementById('endDate').value;
                if(!startStr || !endStr) { alert("Filtreleme için lütfen tarih seçin."); return; }
                filterBlocks();
                isFilterActive = true;
                btn.innerHTML = "🔄 Filtreyi Kapat (Tümünü Göster)";
                btn.style.backgroundColor = "#4f46e5";
                btn.style.boxShadow = "inset 0 3px 6px rgba(0,0,0,0.3)";
            } else {
                document.querySelectorAll('.model-block').forEach(block => block.classList.remove('hidden-block'));
                isFilterActive = false;
                btn.innerHTML = "👁️ Ekranda Filtrele";
                btn.style.backgroundColor = ""; btn.style.boxShadow = "";
            }
        }

        function filterBlocks() {
            const startDate = document.getElementById('startDate').value;
            const endDate = document.getElementById('endDate').value;
            const selectedFilter = document.getElementById('reportManufacturer').value;

            document.querySelectorAll('.model-block').forEach(block => {
                const dateVal = block.querySelector('.block-date').value;
                if(!dateVal) return;
                const metin = block.querySelector('.red-text-select').value || "";

                if (dateVal < startDate || dateVal > endDate || (selectedFilter !== "TÜMÜ" && metin !== selectedFilter)) {
                    block.classList.add('hidden-block');
                } else {
                    block.classList.remove('hidden-block');
                }
            });
        }

        function exportReport() {
            const startStr = document.getElementById('startDate').value;
            const endStr = document.getElementById('endDate').value;
            const selectedFilter = document.getElementById('reportManufacturer').value;
            if(!startStr || !endStr) { alert("Lütfen tarih seçin."); return; }

            const startParts = startStr.split('-'); const endParts = endStr.split('-');
            const dinamikDosyaAdi = `${startParts[2]}.${startParts[1]}.${startParts[0]} - ${endParts[2]}.${endParts[1]}.${endParts[0]} (${selectedFilter === "TÜMÜ" ? "Tümü" : selectedFilter}) dtf imalatı.csv`;

            let csvContent = "data:text/csv;charset=utf-8,\uFEFF Tarih;Model Kodu;İmalatçı;Metraj (MT)\n";
            let totalFilteredMeters = 0; let matchCount = 0;

            document.querySelectorAll('.model-block').forEach(block => {
                const dateVal = block.querySelector('.block-date').value;
                if(!dateVal) return;
                const modelKodu = block.querySelector('.model-kodu-input').value.trim();
                if (!modelKodu) return; 

                if (dateVal >= startStr && dateVal <= endStr) {
                    const metin = block.querySelector('.red-text-select').value || "";
                    if (selectedFilter !== "TÜMÜ" && metin !== selectedFilter) return; 

                    const dP = dateVal.split('-');
                    const dateStr = `${dP[2]}.${dP[1]}.${dP[0]}`;
                    const printMetin = metin || "-";
                    const totalStr = block.querySelector('.result-text').innerText.replace(' MT', '');
                    
                    totalFilteredMeters += parseLocalFloat(totalStr); matchCount++;
                    csvContent += `${dateStr};${modelKodu};${printMetin};${totalStr}\n`;
                }
            });

            if(matchCount === 0) { alert("Geçerli veri bulunamadı."); return; }
            csvContent += `\nTOPLAM;;;${parseFloat(totalFilteredMeters.toFixed(1)).toString().replace('.', ',')} MT\n`;
            
            const link = document.createElement("a"); link.setAttribute("href", encodeURI(csvContent));
            link.setAttribute("download", dinamikDosyaAdi); document.body.appendChild(link); link.click(); document.body.removeChild(link);
        }
    </script>
